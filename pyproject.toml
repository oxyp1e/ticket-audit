[project]
name = "ticket-audit"
version = "0.1.0"
description = "Reads transportation tickets, matches them to dispatch and rates, and routes every uncertain load to an exception queue."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
