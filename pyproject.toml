[project]
name = "ticket-audit"
version = "0.1.0"
description = "Reads transportation tickets, matches them to dispatch and rates, and routes every uncertain load to an exception queue."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
